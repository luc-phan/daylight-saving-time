[project]
name = "daylight-saving-time"
version = "0.1.0"
description = "Email reminders before European DST transitions (last Sunday of March/October)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=46.0.6",
    "invoke>=2.2.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

