paths:
  secret_key: "var/.secret_key"
  secret_password: "var/.secret_password"
  state_file: "var/state.json"

smtp:
  server: "smtp.example.com"
  port: 587
  sender_email: "hello@example.com"

receivers:
  - "alert@example.com"

language: french

notifications:
  - days_before: 14
    template: alert_days_before.txt
  - days_before: 7
    template: alert_days_before.txt
  - days_before: 1
    template: alert_1_day.txt
  - days_before: 0
    template: alert_0_day.txt

logging:
  version: 1
  disable_existing_loggers: false
  formatters:
    standard:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      formatter: standard
      level: INFO
    file:
      class: logging.FileHandler
      filename: "var/dst_notifier.log"
      formatter: standard
      level: INFO
  loggers: {}
  root:
    level: INFO
    handlers: [console, file]
